<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teledentistry Portal - Mobile Camera</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="global.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        
        .mobile-pill-btn {
            @apply flex flex-col items-center justify-center transition-all active:scale-90;
        }
        
        .circular-control {
            width: 72px;
            height: 72px;
            @apply rounded-full flex items-center justify-center glass border border-white/20 shadow-xl;
        }
        
        .circular-control.active {
            @apply bg-yellow-400/30 border-yellow-400/50 text-yellow-300;
        }

        .circular-control.danger {
            @apply bg-red-500/80 border-red-400/30 text-white shadow-red-500/20;
        }

        .tap-elastic {
            transition: transform 0.4s var(--spring);
        }
        .tap-elastic:active {
            transform: scale(0.85);
        }

        @keyframes live-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }
        .live-pulse { animation: live-pulse 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-black text-white relative h-screen overflow-hidden">

    <!-- ── FULL-BLEED VIDEO BACKGROUND ────────────────────────────── -->
    <video id="localMobileVideo" autoplay playsinline muted
           class="absolute inset-0 w-full h-full object-cover z-0"></video>
    
    <!-- Dark gradient overlay for readability -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80 pointer-events-none z-10"></div>

    <!-- ── TOP HEADER — Minimal Glass Overlay ─────────────────────── -->
    <div class="absolute top-0 left-0 w-full z-30 px-6 pt-[env(safe-area-inset-top)] pointer-events-none">
        <div class="flex items-center justify-between py-6">
            <div class="flex items-center gap-3">
                <div class="glass p-2.5 rounded-2xl border border-white/10 pointer-events-auto">
                    <i class="fa-solid fa-tooth text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white leading-none">Teledentistry</h1>
                    <span class="text-[10px] text-white/50 font-bold tracking-widest uppercase mt-1 block">Wand Broadcaster</span>
                </div>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <!-- Live indicator -->
                <div id="liveIndicator" class="hidden items-center gap-2 glass rounded-full px-3 py-1.5 border-red-500/30">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    <span class="text-[10px] font-black text-red-100 tracking-tighter live-pulse">LIVE</span>
                </div>
                <!-- Network Health -->
                <div id="network-monitor" class="flex items-center gap-2 glass rounded-full px-3 py-1.5 border-white/10">
                    <div id="net-dot" class="w-2 h-2 rounded-full bg-gray-500 transition-colors"></div>
                    <span id="net-text" class="text-[9px] font-bold text-white/40 uppercase tracking-widest leading-none">Wait</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ── MOBILE ENTRY MODAL ─────────────────────────────────────── -->
    <div id="joinOverlay" class="absolute inset-0 z-50 flex items-center justify-center p-6 backdrop-blur-2xl bg-black/40">
        <div class="w-full max-w-sm glass glass-reflect rounded-[2.5rem] p-8 modal-enter border-white/10">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white/5 border border-white/10 mb-5">
                    <i class="fa-solid fa-signal text-3xl" style="color:var(--accent);"></i>
                </div>
                <h2 class="text-2xl font-black text-white tracking-tight">Broadcast Portal</h2>
                <p class="text-white/40 text-sm mt-2 font-medium">Link this wand to a clinical session</p>
            </div>

            <div class="space-y-4">
                <div class="relative group">
                    <div class="absolute left-6 top-1/2 -translate-y-1/2 text-white/20">
                        <i class="fa-solid fa-hashtag text-sm"></i>
                    </div>
                    <input type="text" id="roomId" placeholder="Session ID"
                           class="pill-input pl-14 py-5 bg-white/5 border-white/10 focus:bg-white/10 text-lg">
                </div>
                <div class="relative group">
                    <div class="absolute left-6 top-1/2 -translate-y-1/2 text-white/20">
                        <i class="fa-solid fa-fingerprint text-sm"></i>
                    </div>
                    <input type="text" id="roomPin" placeholder="4-Digit PIN" maxlength="4"
                           class="pill-input pl-14 py-5 tracking-[0.4em] text-center font-mono bg-white/5 border-white/10 text-lg">
                </div>

                <button id="joinRoomBtn"
                        class="w-full py-5 rounded-full font-black text-lg tracking-wide text-white spring-transition active:scale-95 shadow-2xl mt-4"
                        style="background:linear-gradient(135deg, var(--accent), hsl(calc(var(--accent-h) + 20), var(--accent-s), var(--accent-l)));">
                    START BROADCAST
                </button>
            </div>
        </div>
    </div>

    <!-- ── MOBILE BOTTOM NAVIGATION ──────────────────────────────── -->
    <div id="controlBar" class="absolute bottom-0 left-0 w-full z-40 hidden transition-all duration-500 transform translate-y-0">
        <!-- Intense frosted blur -->
        <div class="absolute inset-0 bg-black/20 backdrop-blur-3xl border-t border-white/10 -z-10"></div>

        <div class="flex justify-around items-center pt-8 pb-[max(2rem,env(safe-area-inset-bottom))] px-6">

            <!-- Camera Toggle -->
            <button id="mobileCamToggleBtn" class="mobile-pill-btn group">
                <div class="circular-control tap-elastic">
                    <i id="mobileCamIcon" class="fa-solid fa-video text-2xl"></i>
                </div>
            </button>

            <!-- Flashlight -->
            <button id="mobileFlashBtn" class="mobile-pill-btn group">
                <div id="flashBtnBg" class="circular-control tap-elastic">
                    <i id="mobileFlashIcon" class="fa-solid fa-bolt-lightning text-2xl"></i>
                </div>
            </button>

            <!-- End Call -->
            <button id="mobileEndCallBtn" class="mobile-pill-btn group">
                <div class="circular-control danger tap-elastic">
                    <i class="fa-solid fa-power-off text-2xl"></i>
                </div>
            </button>

        </div>
    </div>

    <!-- ── SCRIPT — Preserved Logic ──────────────────────────────── -->
    <script>
    'use strict';
    // Configuration
    const WS_URL   = 'wss://tele-dentistry-server.onrender.com';
    const RTC_CONFIG = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
        ],
    };

    const localPeerId = 'mob-' + Math.random().toString(36).substr(2, 6);
    let socket        = null;
    let currentRoomId = null;
    let localStream   = null;
    let activeTrack   = null;
    let torchOn       = false;
    let camPaused     = false;

    const peerConnections = {};

    const videoEl        = document.getElementById('localMobileVideo');
    const joinOverlay    = document.getElementById('joinOverlay');
    const controlBar     = document.getElementById('controlBar');
    const liveIndicator  = document.getElementById('liveIndicator');
    const joinBtn        = document.getElementById('joinRoomBtn');
    const camToggleBtn   = document.getElementById('mobileCamToggleBtn');
    const flashBtn       = document.getElementById('mobileFlashBtn');
    const endCallBtn     = document.getElementById('mobileEndCallBtn');

    function log(...a)  { console.log(`[mobile/${localPeerId}]`, ...a); }
    function warn(...a) { console.warn(`[mobile/${localPeerId}]`, ...a); }

    function showToast(message, type = 'info') {
        let t = document.getElementById('mob-toaster');
        if (!t) {
            t = document.createElement('div');
            t.id = 'mob-toaster';
            t.style.cssText = `
                position:fixed; top:80px; left:50%; transform:translateX(-50%);
                padding:12px 24px; border-radius:16px; font-size:14px; z-index:9999;
                max-width:90vw; text-align:center; color:#fff; transition:all 0.4s;
                backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.1);
                font-weight:600;
            `;
            document.body.appendChild(t);
        }
        t.style.background = type === 'error' ? 'rgba(239,68,68,0.7)' : 'rgba(255,255,255,0.1)';
        t.textContent = message;
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(t._t);
        t._t = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(-20px)'; }, 4000);
    }

    async function startCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true,
            });
            activeTrack = localStream.getVideoTracks()[0];
            window.localStream = localStream;
            videoEl.srcObject = localStream;
            videoEl.muted = true;
            videoEl.volume = 0;
            videoEl.play().catch(() => {});
        } catch (err) {
            showToast('Camera Permission Denied', 'error');
        }
    }

    function connectSignaling(cb) {
        if (socket && socket.readyState === WebSocket.OPEN) { cb(); return; }
        socket = new WebSocket(WS_URL);
        socket.onopen = () => { cb(); startNetworkMonitoring(); };
        socket.onmessage = (ev) => {
            let msg; try { msg = JSON.parse(ev.data); } catch { return; }
            routeMessage(msg);
        };
    }

    function send(payload) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        payload.peer_id = localPeerId;
        payload.sender_id = localPeerId;
        socket.send(JSON.stringify(payload));
    }

    async function routeMessage(msg) {
        switch (msg.event) {
            case 'room_joined': onRoomJoined(msg); break;
            case 'peer_joined': if (msg.peer_id !== localPeerId) initiatePeer(msg.peer_id); break;
            case 'peer_left': cleanupPeer(msg.peer_id); break;
            case 'error': showToast(msg.message, 'error'); break;
            default: {
                if (!msg.sender_id) return;
                if (msg.type === 'offer') await handleOffer(msg);
                else if (msg.type === 'answer') await handleAnswer(msg);
                else if (msg.type === 'ice-candidate') await handleIce(msg);
            }
        }
    }

    function onJoinClick() {
        const roomId = document.getElementById('roomId').value.trim();
        const pin    = document.getElementById('roomPin').value.trim();
        if (!roomId || pin.length < 4) { showToast('Invalid credentials', 'error'); return; }
        startCamera().then(() => {
            if (!localStream) return;
            connectSignaling(() => send({ action: 'join_room', room_id: roomId, pin }));
        });
    }

    function onRoomJoined(msg) {
        currentRoomId = msg.room_id;
        joinOverlay.classList.add('hidden');
        controlBar.classList.remove('hidden');
        liveIndicator.classList.remove('hidden');
        liveIndicator.classList.add('flex');
    }

    function getOrCreatePC(remotePeerId) {
        if (peerConnections[remotePeerId]) return peerConnections[remotePeerId];
        const pc = new RTCPeerConnection(RTC_CONFIG);
        peerConnections[remotePeerId] = pc;
        pc.onicecandidate = ({ candidate }) => {
            if (candidate) send({ action: 'relay', room_id: currentRoomId, target_id: remotePeerId, type: 'ice-candidate', candidate: candidate.toJSON() });
        };
        if (window.localStream) window.localStream.getTracks().forEach(track => pc.addTrack(track, window.localStream));
        return pc;
    }

    async function initiatePeer(remotePeerId) {
        const pc = getOrCreatePC(remotePeerId);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        send({ action: 'relay', room_id: currentRoomId, target_id: remotePeerId, type: 'offer', sdp: pc.localDescription });
    }

    async function handleOffer(msg) {
        const pc = getOrCreatePC(msg.sender_id);
        await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({ action: 'relay', room_id: currentRoomId, target_id: msg.sender_id, type: 'answer', sdp: pc.localDescription });
    }

    async function handleAnswer(msg) {
        const pc = peerConnections[msg.sender_id];
        if (pc && pc.signalingState === 'have-local-offer') await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    }

    async function handleIce(msg) {
        const pc = peerConnections[msg.sender_id];
        if (pc && msg.candidate) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
    }

    async function startNetworkMonitoring() {
        setInterval(async () => {
            const pcs = Object.values(peerConnections);
            const dot = document.getElementById('net-dot');
            const text = document.getElementById('net-text');
            if (pcs.length === 0) return;
            let worstRTT = 0;
            for (const pc of pcs) {
                const stats = await pc.getStats();
                stats.forEach(report => {
                    if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                        const rtt = (report.currentRoundTripTime || 0) * 1000;
                        if (rtt > worstRTT) worstRTT = rtt;
                    }
                });
            }
            if (worstRTT < 150) { dot.className = 'w-2 h-2 rounded-full bg-emerald-500'; text.textContent = 'Good'; }
            else if (worstRTT < 400) { dot.className = 'w-2 h-2 rounded-full bg-amber-500'; text.textContent = 'Fair'; }
            else { dot.className = 'w-2 h-2 rounded-full bg-red-500'; text.textContent = 'Poor'; }
        }, 3000);
    }

    function cleanupPeer(peerId) {
        const pc = peerConnections[peerId];
        if (pc) { pc.close(); delete peerConnections[peerId]; }
    }

    function toggleCamera() {
        if (!localStream) return;
        camPaused = !camPaused;
        localStream.getVideoTracks().forEach(t => { t.enabled = !camPaused; });
        document.getElementById('mobileCamIcon').className = camPaused ? 'fa-solid fa-video-slash text-red-400 text-2xl' : 'fa-solid fa-video text-white text-2xl';
        send({ action: 'relay', room_id: currentRoomId, type: 'media_state', video: !camPaused });
    }

    async function toggleFlash() {
        if (!activeTrack) return;
        const caps = activeTrack.getCapabilities?.() ?? {};
        if (!caps.torch) { showToast('No Flashlight Support', 'info'); return; }
        torchOn = !torchOn;
        try {
            await activeTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
            document.getElementById('flashBtnBg').classList.toggle('active', torchOn);
        } catch (e) { torchOn = !torchOn; }
    }

    function endCall() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        Object.keys(peerConnections).forEach(id => cleanupPeer(id));
        if (socket) socket.close();
        window.location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
        joinBtn.addEventListener('click', onJoinClick);
        camToggleBtn.addEventListener('click', toggleCamera);
        flashBtn.addEventListener('click', toggleFlash);
        endCallBtn.addEventListener('click', endCall);
    });
    </script>
</body>
</html>
