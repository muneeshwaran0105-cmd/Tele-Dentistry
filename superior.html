<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teledentistry Portal - Consultant</title>
    <meta name="description" content="Teledentistry Consultant Dashboard — live clinical video conferencing with iOS-style Glassmorphism UI.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        medical: {
                            blue: '#3b82f6',
                            dark: '#0f172a',
                            light: '#f8fafc',
                            white: '#FFFFFF',
                            green: '#10b981',
                            red: '#ef4444',
                            gray: '#cbd5e1'
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="global.css">
    <style>
        /* ── Dynamic Video Grid ──────────────────────────────────────── */
        #dynamicVideoGrid {
            display: grid;
            gap: 12px;
            padding: 12px;
            width: 100%;
            height: 100%;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #dynamicVideoGrid.grid-1 { grid-template-columns: 1fr; }
        #dynamicVideoGrid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-3 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-5,
        #dynamicVideoGrid.grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-many { grid-template-columns: repeat(3, 1fr); }

        /* ── Video Tile ──────────────────────────────────────────────── */
        .video-tile {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.06);
            transition: all 0.3s var(--spring);
            min-height: 0;
        }
        .video-tile:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
            transform: scale(1.005);
        }
        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .video-tile .tile-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .video-tile .tile-label .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px rgba(16,185,129,0.9);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Focus Button on each tile */
        .video-tile .focus-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 15;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: all 0.25s var(--spring);
            transform: scale(0.9);
        }
        .video-tile:hover .focus-btn,
        .video-tile .focus-btn.visible {
            opacity: 1;
            transform: scale(1);
        }
        .video-tile .focus-btn:hover {
            background: hsla(var(--accent-h), var(--accent-s), var(--accent-l), 0.7);
        }
        .video-tile .focus-btn:active {
            transform: scale(0.92);
        }

        /* Focus-mode tile */
        .video-tile.focused {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            border-color: var(--accent);
            border-radius: 20px;
        }
        .video-tile.focused .focus-btn {
            opacity: 1;
            transform: scale(1);
            background: rgba(239,68,68,0.7);
        }
        .video-tile.focused .focus-btn:hover {
            background: rgba(239,68,68,0.9);
        }

        /* Hide non-focused tiles when focus mode is active */
        #dynamicVideoGrid.focus-active .video-tile:not(.focused) {
            display: none;
        }

        /* Empty-state placeholder */
        #gridEmptyState {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.25);
            gap: 14px;
        }
        #gridEmptyState i { font-size: 4rem; opacity: 0.25; }
        #gridEmptyState p { font-size: 1rem; font-weight: 500; opacity: 0.5; letter-spacing: 0.03em; }
        html:not(.dark) #gridEmptyState { color: rgba(0,0,0,0.3); }

        /* ── Special override for sidebar on superior page ──────────── */
        #leftSidebar {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="text-white flex flex-col h-screen overflow-hidden relative">

    <!-- ── Ambient Background Orbs ─────────────────────────────────── -->
    <div class="ambient-orb" style="width:500px;height:500px;background:var(--accent);top:-100px;left:-100px;"></div>
    <div class="ambient-orb" style="width:400px;height:400px;background:#8b5cf6;bottom:-80px;right:-80px;"></div>
    <div class="ambient-orb" style="width:300px;height:300px;background:#06b6d4;top:40%;left:60%;"></div>

    <!-- Phase 22: Theme & Dark Mode Controller -->
    <script>
    (function() {
        'use strict';

        // ── Dark Mode Toggle ────────────────────────────────────────
        const darkToggle = document.getElementById('darkModeToggle');
        const darkIcon = document.getElementById('darkModeIcon');
        const html = document.documentElement;

        function setDarkMode(dark) {
            if (dark) {
                html.classList.add('dark');
                document.body.style.background = '#0a0a0f';
                document.body.classList.add('text-white');
                document.body.classList.remove('text-slate-800');
                if (darkIcon) {
                    darkIcon.className = 'fa-solid fa-moon text-sm text-blue-400';
                }
            } else {
                html.classList.remove('dark');
                document.body.style.background = '';
                document.body.classList.remove('text-white');
                document.body.classList.add('text-slate-800');
                if (darkIcon) {
                    darkIcon.className = 'fa-solid fa-sun text-sm text-amber-400';
                }
            }
        }

        if (darkToggle) {
            darkToggle.addEventListener('click', () => {
                const isDark = html.classList.contains('dark');
                setDarkMode(!isDark);
            });
        }

        // ── Theme Color Picker ──────────────────────────────────────
        const colorPicker = document.getElementById('themeColorPicker');
        if (colorPicker) {
            colorPicker.addEventListener('input', (e) => {
                const hex = e.target.value;
                // Convert hex to HSL
                const r = parseInt(hex.slice(1,3), 16) / 255;
                const g = parseInt(hex.slice(3,5), 16) / 255;
                const b = parseInt(hex.slice(5,7), 16) / 255;

                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;

                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                        case g: h = ((b - r) / d + 2) / 6; break;
                        case b: h = ((r - g) / d + 4) / 6; break;
                    }
                }

                document.documentElement.style.setProperty('--accent-h', Math.round(h * 360));
                document.documentElement.style.setProperty('--accent-s', Math.round(s * 100) + '%');
                document.documentElement.style.setProperty('--accent-l', Math.round(l * 100) + '%');
            });
        }
    })();
    </script>

    <!-- Phase 9: Draggable PiP -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const localPip = document.getElementById('localPreviewContainer');
            if (localPip && typeof makeDraggable === 'function') {
                makeDraggable(localPip);
            }
        });
    </script>
</body>
