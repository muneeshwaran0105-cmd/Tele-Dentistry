<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teledentistry Portal - Consultant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        medical: {
                            blue: '#3b82f6',
                            dark: '#0f172a',
                            light: '#f8fafc',
                            white: '#FFFFFF',
                            green: '#10b981',
                            red: '#ef4444',
                            gray: '#cbd5e1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        /* Scrollbar styles for pure modern feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Dynamic Video Grid ─────────────────────────────────────── */
        #dynamicVideoGrid {
            display: grid;
            gap: 12px;
            padding: 12px;
            width: 100%;
            height: 100%;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Grid column presets driven by JS */
        #dynamicVideoGrid.grid-1 { grid-template-columns: 1fr; }
        #dynamicVideoGrid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-3 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-5,
        #dynamicVideoGrid.grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
        #dynamicVideoGrid.grid-many { grid-template-columns: repeat(3, 1fr); }

        /* ── Video Tile ─────────────────────────────────────────────── */
        .video-tile {
            position: relative;
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 0;
        }
        .video-tile:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.25);
        }
        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .video-tile .tile-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .video-tile .tile-label .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px rgba(16,185,129,0.8);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Focus Button on each tile */
        .video-tile .focus-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 15;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, transform 0.15s;
            transform: scale(0.95);
        }
        .video-tile:hover .focus-btn,
        .video-tile .focus-btn.visible {
            opacity: 1;
            transform: scale(1);
        }
        .video-tile .focus-btn:hover {
            background: rgba(59,130,246,0.7);
        }
        .video-tile .focus-btn:active {
            transform: scale(0.92);
        }

        /* Focus-mode tile: fill entire grid */
        .video-tile.focused {
            grid-column: 1 / -1;
            grid-row: 1 / -1;
            border-color: #3b82f6;
            border-radius: 16px;
        }
        .video-tile.focused .focus-btn {
            opacity: 1;
            transform: scale(1);
            background: rgba(239,68,68,0.7);
        }
        .video-tile.focused .focus-btn:hover {
            background: rgba(239,68,68,0.9);
        }

        /* Hide non-focused tiles when focus mode is active */
        #dynamicVideoGrid.focus-active .video-tile:not(.focused) {
            display: none;
        }

        /* Empty-state placeholder inside the grid */
        #gridEmptyState {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            gap: 12px;
        }
        #gridEmptyState i { font-size: 3.5rem; opacity: 0.3; }
        #gridEmptyState p { font-size: 1rem; font-weight: 500; opacity: 0.7; letter-spacing: 0.02em; }
    </style>
</head>
<body class="text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- ── Header & Connection Bar ──────────────────────────────────────── -->
    <header class="bg-white border-b border-slate-200 shrink-0 z-50">
        <!-- Top Branding -->
        <div class="border-b border-slate-100 bg-white/90 backdrop-blur-md px-4 sm:px-6 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-50 p-1.5 sm:p-2 rounded-xl text-medical-blue">
                    <i class="fa-solid fa-stethoscope sm:text-xl"></i>
                </div>
                <h1 class="text-lg sm:text-2xl font-bold tracking-tight text-slate-800">
                    Teledentistry
                    <span class="text-slate-400 font-normal hidden sm:inline ml-2 border-l border-slate-300 pl-3 text-lg">Consultant Dashboard</span>
                </h1>
            </div>
            
            <!-- Connection Status -->
            <div id="connectionStatus" class="hidden items-center space-x-2 bg-emerald-50 border border-emerald-200 px-4 py-1.5 rounded-full shadow-sm">
                <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse relative">
                    <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping"></span>
                </span>
                <span class="text-xs sm:text-sm font-semibold text-emerald-700 tracking-wide" id="statusText">Connected</span>
            </div>
            <!-- Mobile Sidebar Toggle -->
            <button id="sidebarToggleBtn" class="xl:hidden text-slate-500 hover:text-medical-blue transition-colors px-2">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>

        <!-- Connection Panel -->
        <div class="bg-slate-50 px-4 sm:px-6 py-2.5 flex flex-col sm:flex-row gap-3 items-center shadow-inner">
            <div class="flex gap-3 flex-1 w-full max-w-sm">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-globe text-slate-400"></i>
                    </div>
                    <input type="text" id="roomId" placeholder="Room ID"
                           class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-medical-blue text-sm shadow-sm transition-colors">
                </div>
                <div class="relative w-28">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-400"></i>
                    </div>
                    <input type="text" id="roomPin" placeholder="PIN" maxlength="4"
                           class="w-full pl-9 pr-2 py-1.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-medical-blue text-center font-mono text-sm tracking-widest shadow-sm transition-colors">
                </div>
            </div>
            <button id="joinRoomBtn"
                    class="w-full sm:w-auto bg-medical-blue hover:bg-blue-600 text-white px-5 py-1.5 rounded-lg font-medium shadow-md shadow-blue-500/20 flex items-center justify-center space-x-2 text-sm transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Secure Join</span>
            </button>
            <div class="ml-auto hidden xl:block text-xs font-semibold text-slate-400 tracking-wider">
                <i class="fa-regular fa-clock mr-1"></i> LIVE CONSULTATION
            </div>
        </div>
    </header>

    <!-- ── 3-Column Clinical Layout ─────────────────────────────────────── -->
    <main class="flex-grow flex flex-col xl:flex-row w-full h-[calc(100vh-115px)] bg-slate-100/50 p-3 sm:p-4 gap-4">

        <!-- Left Column: Session Details (20%) -->
        <aside id="leftSidebar" class="hidden xl:flex flex-col w-full xl:w-1/5 h-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden shrink-0 absolute xl:relative z-40 inset-0 xl:inset-auto m-3 xl:m-0">
            <div class="bg-gradient-to-r from-slate-50 to-white py-3 px-4 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h2 class="font-medium text-slate-700 flex items-center space-x-2 text-sm">
                    <i class="fa-regular fa-folder-open text-medical-blue"></i>
                    <span>Session Notes</span>
                </h2>
                <button class="xl:hidden text-slate-400 hover:text-red-500" onclick="document.getElementById('leftSidebar').classList.add('hidden')">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-grow flex flex-col p-4 space-y-4 overflow-y-auto">
                <div class="flex flex-col space-y-1.5 h-1/2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Patient Notes</label>
                    <textarea class="flex-grow w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-medical-blue focus:bg-white transition-colors resize-none shadow-inner" placeholder="Document clinical findings here..."></textarea>
                </div>
                <div class="flex flex-col space-y-1.5 flex-grow">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Event Log</label>
                    <div id="eventLog" class="flex-grow w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-[11px] font-mono overflow-y-auto shadow-inner text-slate-300">
                        <!-- Events populated by ui.js appendEventLog -->
                        <div class="text-slate-500">System initialized... Ready to join.</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Column: Dynamic Video Grid (fills remaining space) -->
        <section class="flex-grow h-full bg-slate-900 rounded-2xl shadow-xl border border-slate-800 overflow-hidden relative">
            <div id="dynamicVideoGrid" class="grid-1">
                <!-- Empty state shown when no peers are connected -->
                <div id="gridEmptyState">
                    <i class="fa-solid fa-users-viewfinder"></i>
                    <p>Waiting for participants to join…</p>
                </div>
            </div>
        </section>

    </main>

    <!-- ── Consultant Media Control Bar ────────────────────────────── -->
    <div class="fixed bottom-0 left-0 w-full z-50 transition-all">
        <div class="absolute inset-0 bg-white/80 backdrop-blur-lg border-t border-slate-200 shadow-up pb-[env(safe-area-inset-bottom)] -z-10"></div>
        <div class="max-w-4xl mx-auto px-2 py-3 sm:py-4 flex justify-around sm:justify-center items-center sm:space-x-8">

            <!-- Start Camera -->
            <button id="consultantStartCamBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-video text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Start Cam</span>
            </button>

            <!-- Mic Toggle -->
            <button id="consultantMicToggleBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-microphone text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Mic</span>
            </button>

            <!-- Camera Toggle -->
            <button id="consultantCamToggleBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-camera text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Camera</span>
            </button>

            <!-- Snapshot -->
            <button id="snapshotBtn2" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-image text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Snapshot</span>
            </button>

        </div>
    </div>

    <!-- ── Floating Local Self-View Preview ────────────────────────── -->
    <div id="localPreviewContainer" class="fixed bottom-24 right-6 z-50 w-36 h-28 sm:w-44 sm:h-32 rounded-2xl overflow-hidden shadow-2xl border-2 border-white/30 ring-2 ring-medical-blue/30 bg-slate-900 transition-all hover:scale-105 cursor-move group" style="display:none;">
        <video id="localConsultantVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div class="absolute bottom-1.5 left-2 z-10 bg-black/60 backdrop-blur-sm text-white px-2 py-0.5 rounded text-[9px] font-semibold tracking-wide pointer-events-none">
            You
        </div>
        <div class="absolute top-1.5 right-1.5 z-10">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
            </span>
        </div>
    </div>

    <!-- Phase 4: WebRTC & Overhaul Scripts -->
    <script src="ui.js"></script>
    <script src="webrtc.js"></script>
    
    <!-- Phase 10: Dynamic Grid is now handled entirely by webrtc.js -->

    <!-- Phase 9: Draggable PiP -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Make the Consultant's local self-view PiP draggable
            const localPip = document.getElementById('localPreviewContainer');
            if (localPip && typeof makeDraggable === 'function') {
                makeDraggable(localPip);
            }
        });
    </script>
</body>
</html>
