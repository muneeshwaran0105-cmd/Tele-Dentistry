<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teledentistry Portal - Provider</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            blue: '#4A90E2',
                            dark: '#2C3E50',
                            light: '#ECF0F1',
                            white: '#FFFFFF',
                            green: '#27AE60',
                            red: '#E74C3C',
                            gray: '#BDC3C7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; }
        /* Ensure video placeholders never exceed viewport width on mobile */
        #pcFeedPlaceholder, #intaoralPlaceholder { max-width: 100vw; }
    </style>
</head>
<body class="text-medical-dark flex flex-col min-h-screen">

    <!-- ── Header (logo + title only on mobile, no inputs) ─────────────── -->
    <header class="bg-white shadow-md py-3 px-4 sm:px-6 fixed w-full top-0 z-50 border-b border-gray-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 sm:space-x-3">
                <span class="material-icons text-medical-blue text-2xl sm:text-3xl">local_hospital</span>
                <h1 class="text-lg sm:text-2xl font-semibold tracking-tight">
                    Teledentistry
                    <span class="text-gray-500 text-base sm:text-2xl font-light hidden sm:inline"> - Provider</span>
                </h1>
            </div>
            <!-- Status badge (shown after connecting) -->
            <div id="connectionStatus" class="hidden items-center space-x-2 bg-green-50 border border-green-200 px-3 py-1.5 rounded-full">
                <span class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-xs font-medium text-green-700" id="statusText">Connected</span>
            </div>
        </div>
    </header>

    <!-- ── Connection Panel (below header, full-width) ──────────────────── -->
    <div class="fixed top-[57px] sm:top-[65px] w-full z-40 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <!-- Inputs row -->
            <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 sm:items-center">
                <div class="flex gap-2 flex-1">
                    <input type="text" id="roomId"
                           placeholder="Room ID (optional)"
                           class="flex-1 min-w-0 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-medical-blue font-mono text-sm shadow-sm">
                    <input type="text" id="roomPin"
                           placeholder="PIN (auto)"
                           maxlength="4"
                           class="w-28 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-medical-blue text-center font-mono text-sm tracking-widest shadow-sm">
                </div>
                <!-- Buttons row -->
                <div class="flex gap-2">
                    <button id="createRoomBtn"
                            class="flex-1 sm:flex-none bg-medical-blue hover:bg-blue-600 text-white px-4 py-2 rounded-md font-medium transition-colors shadow-sm flex items-center justify-center space-x-1.5 text-sm">
                        <span class="material-icons text-base">add_circle</span>
                        <span>Create New Room</span>
                    </button>
                    <button id="joinRoomBtn"
                            class="flex-1 sm:flex-none border-2 border-medical-blue text-medical-blue hover:bg-blue-50 px-4 py-2 rounded-md font-medium transition-colors shadow-sm flex items-center justify-center space-x-1.5 text-sm">
                        <span class="material-icons text-base">login</span>
                        <span>Join Existing Room</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Main Content ─────────────────────────────────────────────────── -->
    <!-- top padding accounts for header (~57-65px) + connection panel (~100-120px) -->
    <main class="flex-grow pt-[175px] sm:pt-[150px] pb-36 px-4 max-w-7xl mx-auto w-full flex flex-col space-y-4 sm:space-y-6">

        <!-- Video Feeds Section — single column on mobile, 2-col on md+ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 w-full">

            <!-- PC Camera Feed -->
            <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden flex flex-col">
                <div class="bg-gray-50 py-3 px-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="font-medium text-gray-700 flex items-center space-x-2 text-sm sm:text-base">
                        <span class="material-icons text-medical-blue text-sm">videocam</span>
                        <span>PC Camera Feed</span>
                    </h2>
                    <span class="flex h-3 w-3 relative">
                      <span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-red-400 opacity-75"></span>
                      <span id="pcIndicator" class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                </div>
                <!-- Placeholder for Video -->
                <div id="pcFeedPlaceholder" class="aspect-video bg-slate-800 flex items-center justify-center relative group isolate overflow-hidden w-full">
                    <div data-overlay class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 pointer-events-none">
                        <span class="material-icons text-4xl sm:text-5xl mb-2 opacity-50">personal_video</span>
                        <p class="text-xs sm:text-sm">Waiting for desktop camera...</p>
                    </div>
                </div>
            </div>

            <!-- Intraoral Camera Feed -->
            <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden flex flex-col">
                <div class="bg-gray-50 py-3 px-4 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="font-medium text-gray-700 flex items-center space-x-2 text-sm sm:text-base">
                        <span class="material-icons text-medical-blue text-sm">camera_enhance</span>
                        <span>Intraoral Camera Feed</span>
                    </h2>
                    <span class="flex h-3 w-3 relative">
                      <span id="intaoralIndicator" class="relative inline-flex rounded-full h-3 w-3 bg-gray-400"></span>
                    </span>
                </div>
                <!-- Placeholder for Video -->
                <div id="intaoralPlaceholder" class="aspect-video bg-slate-800 flex items-center justify-center relative group isolate overflow-hidden w-full">
                     <div data-overlay class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 pointer-events-none">
                        <span class="material-icons text-4xl sm:text-5xl mb-2 opacity-50">flip_camera_ios</span>
                        <p class="text-xs sm:text-sm">Waiting for intraoral feed...</p>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- ── Bottom Control Panel ─────────────────────────────────────────── -->
    <!-- pb-safe adds extra room for mobile browser nav bars -->
    <div class="fixed bottom-0 w-full bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] border-t border-gray-200 z-50"
         style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex justify-around sm:justify-center items-center sm:space-x-12">

            <button id="startCamerasBtn" class="flex flex-col items-center justify-center space-y-1 text-gray-600 hover:text-medical-blue transition-colors group">
                <div class="bg-gray-100 group-hover:bg-blue-50 p-2.5 sm:p-3 rounded-full transition-colors shadow-sm">
                    <span class="material-icons text-xl sm:text-2xl group-hover:scale-110 transition-transform">videocam</span>
                </div>
                <span class="text-xs font-medium">Start Cameras</span>
            </button>

            <!-- Toggle Flashlight -->
            <button id="flashlightToggle" class="flex flex-col items-center justify-center space-y-1 text-gray-600 hover:text-medical-blue transition-colors group">
                <div id="flashlightBg" class="bg-gray-100 group-hover:bg-blue-50 p-2.5 sm:p-3 rounded-full transition-colors shadow-sm">
                    <span id="flashlightIcon" class="material-icons text-xl sm:text-2xl group-hover:scale-110 transition-transform">flashlight_off</span>
                </div>
                <span class="text-xs font-medium">Flashlight</span>
            </button>

            <button id="endCallBtn" class="flex flex-col items-center justify-center space-y-1 text-gray-600 hover:text-red-500 transition-colors group">
                <div class="bg-gray-100 group-hover:bg-red-50 p-2.5 sm:p-3 rounded-full transition-colors shadow-sm">
                    <span class="material-icons text-xl sm:text-2xl group-hover:scale-110 transition-transform">call_end</span>
                </div>
                <span class="text-xs font-medium">End Call</span>
            </button>

        </div>
    </div>

    <!-- Phase 3: Multi-Device Media Controller -->
    <script src="media.js"></script>
    <!-- Phase 4: WebRTC + WebSocket Integration -->
    <script src="webrtc.js"></script>
</body>
</html>
