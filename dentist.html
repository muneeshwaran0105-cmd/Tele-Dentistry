<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teledentistry Portal - Provider</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome (Modern Iconography) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        medical: {
                            blue: '#3b82f6', // modern bright blue
                            dark: '#0f172a', // slate-900
                            light: '#f8fafc', // slate-50
                            white: '#FFFFFF',
                            green: '#10b981', // emerald-500
                            red: '#ef4444', // red-500
                            gray: '#cbd5e1'
                        }
                    },
                    boxShadow: {
                        'up': '0 -4px 6px -1px rgba(0, 0, 0, 0.1), 0 -2px 4px -1px rgba(0, 0, 0, 0.06)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; overflow-x: hidden; }
        /* Smooth transitions */
        button, a, input, select { transition: all 0.3s ease; }
        /* Ensure responsive grid doesn't overflow */
        #pcFeedPlaceholder, #intaoralPlaceholder { max-width: 100vw; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen font-sans">

    <!-- ── Header (Logo & Brand) ─────────────── -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm py-3 px-4 sm:px-6 fixed w-full top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-50 p-2 rounded-xl text-medical-blue">
                    <i class="fa-solid fa-tooth text-xl sm:text-2xl"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-800">
                    Teledentistry
                    <span class="text-slate-400 font-normal hidden sm:inline ml-2 border-l border-slate-300 pl-3">Provider</span>
                </h1>
            </div>
            <!-- Status badge -->
            <div id="connectionStatus" class="hidden items-center space-x-2 bg-emerald-50 border border-emerald-200 px-4 py-1.5 rounded-full shadow-sm">
                <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse relative">
                    <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping"></span>
                </span>
                <span class="text-xs sm:text-sm font-semibold text-emerald-700 tracking-wide" id="statusText">Connected</span>
            </div>
        </div>
    </header>

    <!-- ── Connection Panel ──────────────────── -->
    <div class="fixed top-[60px] sm:top-[72px] w-full z-40 bg-white/80 backdrop-blur border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex flex-col md:flex-row gap-3 md:items-center">
                <div class="flex gap-3 flex-1 relative">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-house-medical text-slate-400"></i>
                        </div>
                        <input type="text" id="roomId"
                               placeholder="Room ID (optional)"
                               class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-blue focus:bg-white font-mono text-sm shadow-inner transition-colors">
                    </div>
                    <div class="relative w-32">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-key text-slate-400"></i>
                        </div>
                        <input type="text" id="roomPin"
                               placeholder="PIN (Auto)"
                               maxlength="4"
                               class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-medical-blue focus:bg-white text-center font-mono text-sm tracking-widest shadow-inner transition-colors">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button id="createRoomBtn"
                            class="flex-1 md:flex-none bg-medical-blue hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium shadow-md shadow-blue-500/20 flex items-center justify-center space-x-2 text-sm transform hover:-translate-y-0.5 active:translate-y-0">
                        <i class="fa-solid fa-plus-circle"></i>
                        <span>Create Session</span>
                    </button>
                    <button id="joinRoomBtn"
                            class="flex-1 md:flex-none bg-white border-2 border-slate-200 hover:border-medical-blue hover:bg-blue-50 text-slate-700 px-5 py-2 rounded-xl font-medium shadow-sm flex items-center justify-center space-x-2 text-sm transform hover:-translate-y-0.5 active:translate-y-0">
                        <i class="fa-solid fa-right-to-bracket text-medical-blue"></i>
                        <span>Join</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── Main Content ─────────────────────────────────────────────────── -->
    <main class="flex-grow pt-[180px] sm:pt-[150px] pb-36 px-4 max-w-7xl mx-auto w-full flex flex-col space-y-6">

        <!-- Video Feeds Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">

            <!-- PC Camera Feed -->
            <div id="pcCard" class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden flex flex-col transition-all duration-300">
                <div class="bg-gradient-to-r from-slate-50 to-white py-3 px-5 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="font-medium text-slate-700 flex items-center space-x-2 text-sm sm:text-base">
                        <i class="fa-solid fa-desktop text-medical-blue"></i>
                        <span>PC Camera Feed</span>
                    </h2>
                    <span class="flex h-3 w-3 relative">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span id="pcIndicator" class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                    </span>
                </div>
                <div id="pcFeedPlaceholder" class="aspect-video bg-slate-900 flex items-center justify-center relative group isolate overflow-hidden w-full">
                    <div data-overlay class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 pointer-events-none bg-slate-900/60 backdrop-blur-sm">
                        <i class="fa-solid fa-video-slash text-4xl sm:text-5xl mb-3 opacity-50 drop-shadow-lg"></i>
                        <p class="text-sm font-medium tracking-wide">Waiting for desktop camera</p>
                    </div>
                </div>
            </div>

            <!-- Intraoral Camera Feed -->
            <div id="intaoralCard" class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden flex flex-col transition-all duration-300">
                <div class="bg-gradient-to-r from-slate-50 to-white py-3 px-5 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="font-medium text-slate-700 flex items-center space-x-2 text-sm sm:text-base">
                        <i class="fa-solid fa-camera-rotate text-medical-blue"></i>
                        <span>Intraoral Camera</span>
                    </h2>
                    <span class="flex h-3 w-3 relative">
                      <span id="intaoralIndicator" class="relative inline-flex rounded-full h-3 w-3 bg-slate-300"></span>
                    </span>
                </div>
                <div id="intaoralPlaceholder" class="aspect-video bg-slate-900 flex items-center justify-center relative group isolate overflow-hidden w-full">
                     <div data-overlay class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 pointer-events-none bg-slate-900/60 backdrop-blur-sm">
                        <i class="fa-solid fa-usb text-4xl sm:text-5xl mb-3 opacity-50 drop-shadow-lg"></i>
                        <p class="text-sm font-medium tracking-wide">Waiting for intraoral feed</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Hardware Selection Controls (New in Overhaul) -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-5 mt-6">
            <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-sliders text-medical-blue"></i>
                <span>Hardware Settings</span>
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="flex flex-col space-y-1.5">
                    <label class="text-xs font-medium text-slate-500">Camera Input</label>
                    <select id="cameraSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-medical-blue transition-shadow appearance-none">
                        <option value="">Default Camera</option>
                    </select>
                </div>
                <div class="flex flex-col space-y-1.5">
                    <label class="text-xs font-medium text-slate-500">Microphone Input</label>
                    <select id="micSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-medical-blue transition-shadow appearance-none">
                        <option value="">Default Microphone</option>
                    </select>
                </div>
                <div class="flex flex-col space-y-1.5">
                    <label class="text-xs font-medium text-slate-500">Intraoral/USB Input</label>
                    <select id="intaoralSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-medical-blue transition-shadow appearance-none">
                        <option value="">Auto-Detect USB</option>
                    </select>
                </div>
            </div>
        </div>

    </main>

    <!-- ── Bottom Control Panel (Frosted Glass on Mobile) ────────── -->
    <div class="fixed bottom-0 left-0 w-full z-50 transition-all">
        <!-- Desktop background wrapper -->
        <div class="absolute inset-0 bg-white/80 backdrop-blur-lg border-t border-slate-200 shadow-up pb-[env(safe-area-inset-bottom)] -z-10"></div>
        
        <div class="max-w-4xl mx-auto px-2 py-3 sm:py-4 flex justify-around sm:justify-center items-center sm:space-x-8">

            <button id="startCamerasBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-video text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Start Cameras</span>
            </button>

            <!-- New Mic Toggle -->
            <button id="micToggleBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-microphone text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Toggle Mic</span>
            </button>

            <!-- New Camera Toggle -->
            <button id="cameraToggleBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-medical-blue transition-colors group">
                <div class="bg-white group-hover:bg-blue-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-video text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Toggle Cam</span>
            </button>

            <!-- Toggle Flashlight -->
            <button id="flashlightToggle" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-yellow-600 transition-colors group">
                <div id="flashlightBg" class="bg-white group-hover:bg-yellow-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i id="flashlightIcon" class="fa-solid fa-bolt text-xl sm:text-2xl group-hover:scale-110 transition-transform block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">Flashlight</span>
            </button>

            <button id="endCallBtn" class="flex flex-col items-center justify-center space-y-1.5 text-slate-600 hover:text-red-500 transition-colors group">
                <div class="bg-white group-hover:bg-red-50 border border-slate-200 border-b-slate-300 p-3 sm:p-4 rounded-2xl transition-all shadow-sm group-hover:shadow-md transform group-active:scale-95">
                    <i class="fa-solid fa-phone-slash text-xl sm:text-2xl group-hover:scale-110 transition-transform text-red-400 block w-6 h-6 text-center leading-6"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-semibold tracking-wide">End Call</span>
            </button>

        </div>
    </div>

    <!-- Application Logic -->
    <script src="ui.js"></script>
    <script src="media.js"></script>
    <script src="webrtc.js"></script>
    
    <!-- Enhancing the indicator look over media.js direct styles -->
    <script>
        // Observe mutations on the indicator dots to ensure they look modern 
        // since media.js manually sets className
        const observer = new MutationObserver(mutations => {
            mutations.forEach(m => {
                if(m.target.className.includes('bg-green-500')) {
                    // It's live! Let's glow the card border
                    if(m.target.id === 'pcIndicator') {
                        document.getElementById('pcCard').classList.add('ring-2', 'ring-emerald-400', 'border-emerald-400');
                    } else if (m.target.id === 'intaoralIndicator') {
                        document.getElementById('intaoralCard').classList.add('ring-2', 'ring-emerald-400', 'border-emerald-400');
                    }
                } else if(m.target.className.includes('bg-gray-400')) {
                    // It's idle
                    if(m.target.id === 'pcIndicator') {
                        document.getElementById('pcCard').classList.remove('ring-2', 'ring-emerald-400', 'border-emerald-400');
                        m.target.className = 'relative inline-flex rounded-full h-3 w-3 bg-slate-300';
                    } else if (m.target.id === 'intaoralIndicator') {
                        document.getElementById('intaoralCard').classList.remove('ring-2', 'ring-emerald-400', 'border-emerald-400');
                        m.target.className = 'relative inline-flex rounded-full h-3 w-3 bg-slate-300';
                    }
                }
            });
        });
        observer.observe(document.getElementById('pcIndicator'), {attributes: true, attributeFilter: ['class']});
        observer.observe(document.getElementById('intaoralIndicator'), {attributes: true, attributeFilter: ['class']});
    </script>
</body>
</html>
