<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teledentistry Portal - Provider</title>
    <meta name="description" content="Teledentistry Provider Dashboard — high-fidelity clinical media broadcast with iOS-style Glassmorphism UI.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        medical: {
                            blue: '#3b82f6',
                            dark: '#0f172a',
                            light: '#f8fafc',
                            white: '#FFFFFF',
                            green: '#10b981',
                            red: '#ef4444',
                            gray: '#cbd5e1'
                        }
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="global.css">
    <style>
        /* ── Page-specific layout ───────────────────────────────────── */
        #pcFeedPlaceholder video {
            width: 100%;
            height: 100%;
            object-fit: cover !important; /* Force cover for massive feeling */
        }
        
        .hardware-bar {
            animation: float-in 0.6s var(--spring) both 0.2s;
        }

        .video-main-container {
            animation: float-in 0.8s var(--spring) both 0.3s;
        }
    </style>
</head>
<body class="text-white flex flex-col min-h-screen relative">

    <!-- ── Ambient Background Orbs ─────────────────────────────────── -->
    <div class="ambient-orb" style="width:500px;height:500px;background:var(--accent);top:-100px;left:-100px;"></div>
    <div class="ambient-orb" style="width:400px;height:400px;background:#8b5cf6;bottom:-80px;right:-80px;"></div>
    
    <!-- ══════════════════════════════════════════════════════════════
         ENTRY MODAL
         ══════════════════════════════════════════════════════════════ -->
    <div id="entryModalOverlay" class="fixed inset-0 z-[100] flex items-center justify-center backdrop-blur-3xl bg-black/30 transition-all duration-500">
        <div class="glass glass-reflect rounded-[2.5rem] p-10 w-[94vw] max-w-md modal-enter" id="entryModalCard">

            <!-- Modal Header -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white/5 border border-white/10 mb-5 shadow-inner">
                    <i class="fa-solid fa-tooth text-3xl" style="color:var(--accent); filter: drop-shadow(0 0 12px var(--accent-glow));"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Teledentistry</h1>
                <p class="text-[13px] text-white/40 font-semibold uppercase tracking-[0.2em]">Clinical Provider</p>
            </div>

            <div class="space-y-5">
                <!-- Room ID -->
                <div class="relative group">
                    <div class="absolute left-6 top-1/2 -translate-y-1/2 text-white/20 transition-colors group-focus-within:text-white/60">
                        <i class="fa-solid fa-hashtag text-sm"></i>
                    </div>
                    <input type="text" id="roomId" placeholder="Session ID (Optional)"
                           class="pill-input pl-14 bg-white/5 border-white/10 hover:bg-white/10 focus:bg-white/10">
                </div>

                <!-- PIN -->
                <div class="relative group">
                    <div class="absolute left-6 top-1/2 -translate-y-1/2 text-white/20 transition-colors group-focus-within:text-white/60">
                        <i class="fa-solid fa-key text-sm"></i>
                    </div>
                    <input type="text" id="roomPin" placeholder="4-Digit PIN" maxlength="4"
                           class="pill-input pl-14 tracking-[0.4em] text-center font-mono bg-white/5 border-white/10 hover:bg-white/10 focus:bg-white/10">
                </div>

                <div class="grid grid-cols-2 gap-4 mt-4">
                    <!-- Create Button -->
                    <button id="createRoomBtn"
                            class="py-4 rounded-full font-bold text-sm tracking-wide text-white spring-transition hover:scale-[1.03] active:scale-[0.97] bg-white/10 border border-white/20 hover:bg-white/15">
                        Create
                    </button>
                    <!-- Join Button -->
                    <button id="joinRoomBtn"
                            class="py-4 rounded-full font-bold text-sm tracking-wide text-white spring-transition hover:scale-[1.03] active:scale-[0.97]"
                            style="background:linear-gradient(135deg, var(--accent), hsl(calc(var(--accent-h) + 20), var(--accent-s), var(--accent-l))); shadow: 0 15px 35px -5px var(--accent-glow);">
                        Join
                    </button>
                </div>
            </div>

            <!-- Footer Meta -->
            <div class="flex items-center justify-center gap-4 mt-8 pt-6 border-t border-white/5">
                <div class="flex items-center gap-1.5 opacity-30">
                    <i class="fa-solid fa-shield-halved text-[10px]"></i>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Encrypted</span>
                </div>
                <div class="w-1 h-1 rounded-full bg-white/20"></div>
                <div class="flex items-center gap-1.5 opacity-30">
                    <i class="fa-solid fa-bolt text-[10px]"></i>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Broadcaster</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ── TOP NAV — Floating Pill Navbar (Flow) ────────────────────── -->
    <header class="w-full relative px-4 py-4 z-50">
        <nav class="glass glass-reflect rounded-2xl px-4 sm:px-6 py-3 flex items-center justify-between">
            <!-- Left: Brand -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl flex items-center justify-center bg-gradient-to-br from-blue-500/20 to-cyan-500/20 border border-white/10">
                    <i class="fa-solid fa-tooth text-sm" style="color:var(--accent);"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight text-white">Teledentistry</h1>
                    <span class="text-[10px] font-medium text-white/30 uppercase tracking-widest">Provider</span>
                </div>
            </div>

            <!-- Center: Connection Status & Room Info -->
            <div class="flex items-center gap-4" id="navCenter">
                <span class="glass rounded-full px-4 py-1.5 text-[11px] font-bold tracking-wide text-white/70 border border-white/5">
                    Room: <span id="displayRoomId" class="text-white">---</span> | PIN: <span id="displayRoomPin" class="text-white">---</span>
                </span>
                <div id="network-monitor" class="flex items-center gap-2 glass rounded-full px-3 py-1.5 border border-white/5">
                    <div id="net-dot" class="w-2.5 h-2.5 rounded-full bg-gray-500 transition-colors duration-500"></div>
                    <span id="net-text" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-none">Waiting...</span>
                </div>
            </div>

            <!-- Right: Controls -->
            <div class="flex items-center gap-3">
                <button id="darkModeToggle" class="w-9 h-9 rounded-xl glass flex items-center justify-center spring-transition hover:scale-110 active:scale-95" title="Toggle Mode">
                    <i class="fa-solid fa-moon text-sm text-white/60"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- ── HARDWARE CONTROL BAR (Standard Document Flow) ───────────────── -->
    <div class="flex w-full max-w-4xl mx-auto justify-center items-center gap-4 mt-4 hardware-bar z-40">
        <div class="glass glass-reflect rounded-2xl p-3 flex flex-col sm:flex-row gap-3 items-center justify-between border border-white/10">
            <div class="flex items-center gap-2 px-2 text-white/40">
                <i class="fa-solid fa-sliders text-sm"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest">Hardware</span>
            </div>
            <div class="flex flex-1 gap-2 w-full">
                <select id="cameraSelect" class="ios-select flex-1">
                    <option value="">WebCam</option>
                </select>
                <select id="micSelect" class="ios-select flex-1">
                    <option value="">Microphone</option>
                </select>
                <select id="intaoralSelect" class="ios-select flex-1">
                    <option value="">Intraoral Device</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ── MAIN VIDEO LAYOUT ───────────────────────────────────────── -->
    <main class="flex-grow flex items-center justify-center w-full relative z-10 px-4 py-8">
        
        <!-- Primary Local Video (Massive) -->
        <section class="video-surface w-full max-w-6xl aspect-video relative video-main-container">
            <div id="pcFeedPlaceholder" class="w-full h-full bg-black/40 flex items-center justify-center">
                <div id="cameraWaitingOverlay" data-overlay class="absolute inset-0 flex flex-col items-center justify-center text-white/20 z-10 bg-slate-900/60 transition-opacity duration-500">
                    <i class="fa-solid fa-video-slash text-6xl mb-4"></i>
                    <p class="text-sm font-bold uppercase tracking-[0.2em]">Awaiting Camera Input</p>
                </div>
            </div>

            <!-- Indicators overlaid on main video -->
            <div class="absolute top-6 left-6 z-30 flex gap-2">
                <span id="pcIndicator" class="relative inline-flex rounded-full h-3 w-3 bg-gray-400"></span>
            </div>
        </section>

        <!-- Secondary Feed (Intraoral) — Hidden unless active -->
        <div id="intaoralCard" class="hidden">
             <!-- Required by media.js for injection -->
             <div id="intaoralPlaceholder"></div>
             <span id="intaoralIndicator"></span>
        </div>

    </main>

    <!-- ── FLOATING CONSULTANT PIP ─────────────────────────────────── -->
    <div id="consultantPipContainer" class="fixed top-48 right-8 z-50 w-48 h-36 sm:w-64 sm:h-48 rounded-3xl overflow-hidden shadow-2xl border border-white/20 bg-black transition-all spring-transition cursor-move flex items-center justify-center" style="display:none;">
        <video id="consultantRemoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
        <div class="absolute inset-0 ring-1 ring-inset ring-white/20 rounded-3xl pointer-events-none"></div>
        <div class="absolute bottom-3 left-3 z-10 glass rounded-full px-3 py-1 text-[10px] font-bold tracking-widest text-white/90 uppercase pointer-events-none border border-white/10">
            Consultant
        </div>
    </div>

    <!-- ── BOTTOM CONTROL BAR — Floating Glass Pill ────────────────── -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-4 px-8 py-4 rounded-full bg-slate-900/50 backdrop-blur-xl border border-white/10 shadow-2xl z-50" id="mediaBar">
        <div class="flex items-center gap-6">
            
            <!-- Start/Toggle Camera -->
            <button id="startCamerasBtn" class="media-btn group" title="Start/Stop Cameras">
                <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            </button>

            <!-- Mic Toggle -->
            <button id="micToggleBtn" class="media-btn group" title="Toggle Mic">
                <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </button>

            <!-- Camera Privacy Toggle -->
            <button id="cameraToggleBtn" class="media-btn group" title="Toggle Privacy">
                <svg class="w-6 h-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>

            <!-- Flashlight -->
            <button id="flashlightToggle" class="media-btn group" title="Flashlight">
                <div id="flashlightBg"></div>
                <i id="flashlightIcon" class="fa-solid fa-bolt text-lg transition-transform group-hover:scale-110"></i>
            </button>

            <div class="w-px h-10 bg-white/10 mx-2"></div>

            <!-- End Call -->
            <button id="endCallBtn" class="media-btn end-call group" title="End Call">
                <svg class="w-7 h-7 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="ui.js"></script>
    <script src="media.js"></script>
    <script src="webrtc.js"></script>
    
    <script>
    (function() {
        const darkToggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;
        if (darkToggle) {
            darkToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
            });
        }

        // Draggable consultant PiP
        document.addEventListener('DOMContentLoaded', () => {
            const pip = document.getElementById('consultantPipContainer');
            if (pip && typeof makeDraggable === 'function') {
                makeDraggable(pip);
            }
        });

        // Close entry modal function
        window.closeEntryModal = function() {
            const overlay = document.getElementById('entryModalOverlay');
            const card = document.getElementById('entryModalCard');
            if (overlay && card) {
                card.classList.add('modal-exit');
                overlay.classList.add('backdrop-exit');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);
            }
        };
    })();
    </script>
</body>
</html>
